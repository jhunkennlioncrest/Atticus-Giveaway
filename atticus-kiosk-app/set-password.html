<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Set your Atticus giveaway password</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0B0B0B;color:#F5F5F5;font:16px/1.55 -apple-system,Segoe UI,Arial,sans-serif;
  display:grid;place-items:center;min-height:100dvh;padding:1.2rem}
.box{width:min(420px,100%);background:#141414;border:1px solid #2A2A2A;border-radius:16px;padding:1.5rem}
h1{font-size:1.25rem;color:#FE5D29;margin:0 0 .3rem}p{color:#A9A9A9;font-size:.9rem;margin:.2rem 0 1rem}
label{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:#A9A9A9;margin:.8rem 0 .3rem}
input{width:100%;box-sizing:border-box;min-height:48px;background:#0B0B0B;border:1px solid #2A2A2A;border-radius:10px;
  color:#F5F5F5;padding:.6rem .8rem;font-size:1rem}
button{width:100%;min-height:50px;margin-top:1.1rem;border:0;border-radius:999px;background:#FE5D29;color:#140702;
  font-weight:700;font-size:1rem;cursor:pointer}
.msg{margin-top:.9rem;font-size:.9rem}.bad{color:#FF6B5A}.ok{color:#5BD18E}
</style></head><body>
<div class="box">
  <h1>Set your password</h1>
  <p id="lead">Choose a password for the Atticus giveaway admin area.</p>
  <label for="pw">New password</label><input id="pw" type="password" autocomplete="new-password">
  <label for="pw2">Repeat it</label><input id="pw2" type="password" autocomplete="new-password">
  <button id="go">Save password</button>
  <p class="msg" id="msg"></p>
</div>
<script>
/* The invitation and reset emails land here with a token in the address. The token goes
   to our own server, which asks Supabase to set the password. No keys live on this page. */
const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const token = hash.get("access_token") || new URLSearchParams(location.search).get("token") || "";
const msg = document.getElementById("msg"), lead = document.getElementById("lead");
if (!token) { lead.textContent = "This link is incomplete. Open the link from your email again, or ask for a new one."; }
document.getElementById("go").addEventListener("click", async () => {
  const a = document.getElementById("pw").value, b = document.getElementById("pw2").value;
  msg.className = "msg";
  if (a.length < 10) { msg.className = "msg bad"; msg.textContent = "Use at least 10 characters."; return; }
  if (a !== b) { msg.className = "msg bad"; msg.textContent = "The two passwords don't match."; return; }
  if (!token) { msg.className = "msg bad"; msg.textContent = "This link has no token. Ask for a new email."; return; }
  try {
    const r = await fetch("/api/app", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ op: "setPassword", token, password: a }) });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || "That didn't work.");
    msg.className = "msg ok";
    msg.innerHTML = 'Password saved. <a href="./" style="color:#FE5D29">Open the kiosk</a>, then press Staff to sign in.';
  } catch (err) { msg.className = "msg bad"; msg.textContent = err.message; }
});
</script></body></html>
