<style>
:root{
  --ink:#000000; --panel:#111111; --panel2:#1A1A1A; --line:#2E2E2E; --line2:#444;
  --paper:#FFFFFF; --muted:#A8A8A8;
  --orange:#FE5D29; --orange-dim:#C94718; --orange-soft:#2A1509;
  --ok:#3FBF77; --ok-soft:#0E2417; --bad:#FF6B57; --bad-soft:#2A1210;
  --display:"Saira", "Arial Narrow", Arial, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, Segoe UI, Arial, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%;overscroll-behavior:none}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;line-height:1.1;margin:0 0 .5rem;text-transform:uppercase}
h1{font-size:clamp(2rem,4.2vw,3.2rem)}
h2{font-size:clamp(1.3rem,2.4vw,1.9rem)}
h3{font-size:1.05rem;letter-spacing:.06em}
p{margin:.35rem 0 .9rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
a{color:var(--orange)}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding:clamp(1rem,3vw,2rem);max-width:1180px;width:100%;margin:0 auto}
.logolink{display:inline-block;line-height:0;border-radius:8px}
.logo{display:block;width:min(420px,58vw);height:auto}
.logo.sm{width:190px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;width:100%}
.result .hairline{width:100%}
.hairline{height:2px;background:linear-gradient(90deg,var(--orange),transparent);margin:.2rem 0 1.2rem}

/* attract */
.attract{align-items:center;justify-content:center;text-align:center;gap:.4rem;cursor:pointer}
.attract h1{font-size:clamp(2.4rem,6.5vw,4.6rem);margin-top:1.4rem}
.attract .kicker{font-family:var(--display);letter-spacing:.32em;color:var(--orange);font-size:clamp(.8rem,1.6vw,1rem)}
.pulse{margin-top:1.6rem;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* buttons */
.btn{appearance:none;border:0;border-radius:999px;background:var(--orange);color:#140702;font:600 1.1rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:1.15rem 2rem;min-height:60px;cursor:pointer;width:100%}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--paper);border:2px solid var(--line2)}
.btn.sm{min-height:44px;padding:.6rem 1.1rem;font-size:.85rem;width:auto}
.btn.wide{max-width:520px;margin:0 auto}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:.4rem}

/* form */
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.4rem}
@media (max-width:760px){ .formgrid{grid-template-columns:1fr} }
.field label.lbl{display:block;font-family:var(--display);letter-spacing:.08em;font-size:.82rem;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.field .req{color:var(--orange)}
.hint{color:var(--muted);font-size:.8rem;margin-top:.3rem}
input[type=text],input[type=email],input[type=tel],input[type=search],input[type=number],select,textarea{
  width:100%;font:inherit;color:var(--paper);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:.85rem .9rem;min-height:58px}
input:focus,select:focus,textarea:focus{border-color:var(--orange);outline:none}
[aria-invalid=true]{border-color:var(--bad)!important}
.err{color:var(--bad);font-size:.85rem;margin-top:.25rem;display:none}
.err.show{display:block}
.phone{display:grid;grid-template-columns:8.5rem 1fr;gap:.6rem}
.consent{grid-column:1/-1;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:1rem}
.consent.bad{border-color:var(--bad)}
.consent .scroller{max-height:132px;overflow:auto;font-size:.86rem;color:var(--muted);padding-right:.5rem;margin:.5rem 0 .2rem;border-left:2px solid var(--line2);padding-left:.7rem}
label.check{display:grid;grid-template-columns:2rem 1fr;gap:.7rem;align-items:start;cursor:pointer}
label.check input{width:1.5rem;height:1.5rem;margin:.1rem 0 0;accent-color:var(--orange)}
.alertbox{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:.8rem 1rem;margin-bottom:1rem}
.okbox{background:var(--ok-soft);border:1px solid var(--ok);border-radius:12px;padding:.8rem 1rem;margin-bottom:1rem}

/* wheel */
.stage{display:grid;grid-template-columns:1fr 340px;gap:clamp(1rem,3vw,2.4rem);align-items:center;flex:1}
@media (max-width:900px){ .stage{grid-template-columns:1fr} .odds-panel{order:2} }
.wheelbox{position:relative;width:min(56vh,520px);margin:0 auto;aspect-ratio:1}
.wheelbox svg.wheel{width:100%;height:auto;display:block;filter:drop-shadow(0 0 40px rgba(254,93,41,.22))}
#rot{transform-origin:0 0;transition:transform 5.2s cubic-bezier(.1,.62,.08,1)}
.needle{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:38px;z-index:2}
@media (prefers-reduced-motion: reduce){ #rot{transition:none} }
.odds-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:.85rem .9rem;max-height:calc(100vh - 170px);overflow:auto}
.odds-panel h3{color:var(--orange);margin-bottom:.6rem}
.everyspin{font-family:var(--display);letter-spacing:.24em;text-transform:uppercase;font-size:.7rem;color:var(--muted);margin:0 0 .3rem}
.prizelist{list-style:none;margin:0;padding:0}
.prizelist li{display:grid;grid-template-columns:auto 1fr;gap:.45rem;align-items:baseline;padding:.34rem 0;border-bottom:1px solid var(--line)}
.prizelist li:last-child{border-bottom:0}
.prizelist .pl-name{font-size:.88rem;line-height:1.3}
.prizelist em{display:block;font-style:normal;font-size:.74rem;color:var(--muted);line-height:1.25}
.prizelist li.top{background:linear-gradient(90deg,rgba(254,93,41,.16),transparent);border-radius:10px;padding-left:.5rem;margin-left:-.5rem;border-bottom:1px solid var(--line)}
.prizelist li.top .pl-name{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em}
.wheelside{display:flex;flex-direction:column;justify-content:center}
.wheelnote{text-align:center;font-size:.78rem;color:var(--muted);margin:.7rem 0 0}
.wheelnote .linkbtn{font-size:.78rem;padding:.1rem}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.42rem .45rem;border-bottom:1px solid var(--line);font-size:.88rem;vertical-align:top}
th{color:var(--muted);font-family:var(--display);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin-right:.45rem;vertical-align:-1px}
.spinstatus{text-align:center;font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--orange);min-height:1.6rem;margin-top:.8rem}

/* result */
.result{text-align:center;align-items:center;justify-content:center}
.prize{font-family:var(--display);font-size:clamp(2rem,5.5vw,3.6rem);color:var(--orange);text-transform:uppercase;margin:.4rem 0 .2rem;line-height:1.05}
.refbox{display:inline-block;border:2px dashed var(--orange);border-radius:14px;padding:.7rem 1.4rem;font-family:var(--display);font-size:clamp(1.3rem,3vw,2rem);letter-spacing:.14em;margin:.8rem 0}
.nextsteps{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1rem 1.2rem;text-align:left;max-width:620px;margin:0 auto 1rem}
.countdown{color:var(--muted);font-size:.85rem;margin-top:.6rem}

/* staff */
.staff{max-width:1240px}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:1rem}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 .9rem var(--display);letter-spacing:.08em;text-transform:uppercase;padding:.7rem .9rem;cursor:pointer}
.tab[aria-selected=true]{color:var(--paper);border-bottom-color:var(--orange)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
.tier{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.9rem}
.tier.off{opacity:.5}
.tier .name{font-family:var(--display);text-transform:uppercase;font-size:.95rem;letter-spacing:.04em;flex:1;min-width:0}
.tier .badge{flex:none}
.tier .count{font-family:var(--display);font-size:1.8rem}
.bar{height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:.5rem 0}
.bar i{display:block;height:100%;background:var(--orange)}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.7rem .9rem}
.stat b{display:block;font-family:var(--display);font-size:1.6rem}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);max-height:60vh}
.scroll table{min-width:900px}
.badge{display:inline-block;font-size:.72rem;border-radius:999px;padding:.1rem .5rem;border:1px solid var(--line2);color:var(--muted)}
.badge.on{border-color:var(--ok);color:var(--ok)}
.badge.off{border-color:var(--bad);color:var(--bad)}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end;margin-bottom:.8rem}
.toolbar .field{flex:1;min-width:11rem}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:18px;width:min(560px,94vw);padding:0}
dialog::backdrop{background:rgba(0,0,0,.72)}
.dlg{padding:1.2rem}
.banner{background:var(--orange-soft);border-bottom:1px solid var(--orange-dim);color:#FFD7C4;padding:.45rem 1rem;font-size:.8rem;text-align:center}
.footnote{color:var(--muted);font-size:.78rem;text-align:center;padding:.6rem}
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,140%);background:var(--panel2);border:1px solid var(--line2);
  border-left:4px solid var(--ok);border-radius:12px;padding:.8rem 1.1rem;max-width:min(560px,92vw);z-index:60;
  transition:transform .25s ease;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:.9rem;white-space:pre-line}
#toast.show{transform:translate(-50%,0)}
#toast.bad{border-left-color:var(--bad)}
.limitedit{display:grid;grid-template-columns:1fr auto auto;gap:.4rem;margin-top:.6rem}
.limitedit input{min-height:40px;padding:.3rem .5rem;font-size:.95rem}
</style>
</head>
<body>
<div id="banner" class="banner"></div>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
"use strict";
/* ===========================================================================
   Atticus Publishing — Frankfurter Buchmesse 2026 spin the wheel
   Tablet kiosk build. Entry happens on the stand tablet only: no shareable link.
   Prize list: simplified list of 17 September 2026. Values in [brackets] are

function phoneDigits(cc, raw){
  let d=String(raw||"").replace(/\D/g,"");
  if(cc!=="other") d=d.replace(/^0+/,"");          // drop the national trunk 0
  return d.slice(0, (PHONE_RULES[cc]||PHONE_RULES.other).max);
}
function phoneFormat(cc, raw){
  const r=PHONE_RULES[cc]||PHONE_RULES.other, d=phoneDigits(cc,raw);
  if(!d) return "";
  const parts=[]; let i=0;
  for(const g of r.groups){ if(i>=d.length) break; parts.push(d.slice(i,i+g)); i+=g; }
  if(i<d.length) parts.push(d.slice(i));
  if(r.style==="us"){
    const [a="",b="",c=""]=parts;
    if(d.length<=3) return "("+a+(d.length===3?") ":"");
    if(d.length<=6) return `(${a}) ${b}`;
    return `(${a}) ${b}-${c}`;
  }
  return (r.style==="plus"?"+":"")+parts.join(" ");
}
function phoneValid(cc, raw){
  const r=PHONE_RULES[cc]||PHONE_RULES.other, d=phoneDigits(cc,raw);

  return d.length>=r.min && d.length<=r.max;

function randInt(n){const max=2**32,lim=max-(max%n),b=new Uint32Array(1);do{crypto.getRandomValues(b);}while(b[0]>=lim);return b[0]%n;}
function code(n,al="ABCDEFGHJKMNPQRSTUVWXYZ23456789"){let s="";for(let i=0;i<n;i++)s+=al[randInt(al.length)];return s;}
async function sha256(s){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("");}

/* ---------------- storage ---------------- */
function localBox(){const m=new Map();try{localStorage.setItem("__t","1");localStorage.removeItem("__t");
  return {get:k=>localStorage.getItem(k),set:(k,v)=>localStorage.setItem(k,v),del:k=>localStorage.removeItem(k),keys:()=>Object.keys(localStorage),persistent:true};}
  catch{return {get:k=>m.get(k)??null,set:(k,v)=>m.set(k,v),del:k=>m.delete(k),keys:()=>[...m.keys()],persistent:false};}}
const LS=localBox();
function localStore(){const P="atticus-fbf26:";const rd=p=>{const v=LS.get(P+p);return v?JSON.parse(v):null;};
  return {kind:LS.persistent?"this tablet":"memory",
    async get(p){return rd(p);},
    async set(p,d){LS.set(P+p,JSON.stringify(d));},
    async update(p,d){const c=rd(p);if(!c)throw new Error("missing");LS.set(P+p,JSON.stringify(deepMerge(c,d)));},
    async del(p){LS.del(P+p);},
    async list(c){const pre=P+c+"/";return LS.keys().filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes("/")).map(k=>JSON.parse(LS.get(k)));},
    async lock(n,fn){return navigator.locks?navigator.locks.request("atticus-"+n,fn):fn();},
    watch(c,cb){let last="";const tick=async()=>{const l=await this.list(c);const s=JSON.stringify(l);if(s!==last){last=s;cb(l);} };tick();const t=setInterval(tick,1500);return ()=>clearInterval(t);}};}
function dbStore(db){const holder="t"+code(8);const dat=s=>s.exists?clone(s.data()):null;
  const retry=async fn=>{try{return await fn();}catch(e){if(e&&e.code==="unavailable"){await sleep(400);return fn();}throw e;}};
  return {kind:"shared (all tablets)",
    async get(p){return dat(await retry(()=>db.doc(p).get()));},
    async set(p,d){return retry(()=>db.doc(p).set(d));},
    async update(p,d){return retry(()=>db.doc(p).update(d));},
    async del(p){return retry(()=>db.doc(p).delete());},
    async list(c){const s=await retry(()=>db.collection(c).get());return s.docs.map(dat);},
    async lock(n,fn){const ref=db.doc("locks/"+n);
      for(let i=0;i<25;i++){const r=await retry(()=>ref.acquire({holder,ttlMs:3000}));if(r.acquired)return await fn();await sleep(200+Math.random()*250);}
      const e=new Error("The wheel is busy. Try again in a moment.");e.code="busy";throw e;},
    watch(c,cb){return db.collection(c).onSnapshot(s=>cb(s.docs.map(dat)),e=>console.warn(e));}};}

/* ---------------- engine (stands in for the server) ---------------- */
const Engine = {
  async config(){const c=await S.get("config/main");return c?deepMerge(DEFAULT_CONFIG,c):clone(DEFAULT_CONFIG);},
  async saveConfig(cfg,by,what){cfg.updatedAt=nowIso();cfg.lastChange={by,what,at:cfg.updatedAt};await S.set("config/main",cfg);},
  live(cfg){return cfg.tiers.filter(t=>t.active&&Number(t.weight)>0);},
  /* On the wheel = switched on, chance above 0, and not yet at its winner limit.
     A tier that fills up drops off by itself; raising its limit brings it back. */
  available(cfg,counts){return this.live(cfg).filter(t=>(counts[t.id]||0)<Number(t.limit));},
  async noteRepeat(email){const key=await sha256("fbf26|"+normEmail(email));const e=await S.get("entries/"+key);
    if(!e) return null; await S.update("entries/"+key,{repeats:(e.repeats||0)+1,updatedAt:nowIso()}); return e;},
  async counts(){const all=await S.list("entries");const c={};for(const e of all)if(e.tierId&&e.status!=="Cancelled")c[e.tierId]=(c[e.tierId]||0)+1;return c;},
  draw(tiers){const units=tiers.map(t=>Math.round(Number(t.weight)*100));const total=units.reduce((a,b)=>a+b,0);
    const r=randInt(total);let acc=0;for(let i=0;i<tiers.length;i++){acc+=units[i];if(r<acc)return tiers[i];}return tiers[tiers.length-1];},
  async enterAndSpin(form){
    const email=normEmail(form.email); const key=await sha256("fbf26|"+email);
    return S.lock("award", async()=>{
      const existing=await S.get("entries/"+key);
      if(existing){ await S.update("entries/"+key,{repeats:(existing.repeats||0)+1,updatedAt:nowIso()}); return {state:"already",entry:existing}; }
      const cfg=await this.config(); const tiers=this.available(cfg, await this.counts());
      if(!tiers.length){const e=new Error("closed");e.code="closed";throw e;}
      const tier=this.draw(tiers); const at=nowIso();
      const entry={
        key, leadId:"L-"+code(6), campaign:cfg.campaignId, tablet:cfg.standTablet,
        name:form.name.trim(), email, phoneCC:form.cc, phone:form.phone.trim(), phoneE164:normPhone(form.cc,form.phone),
        bookTitle:form.book.trim(), createdAt:at, updatedAt:at,
        consent:{given:true, version:cfg.consentVersion, text:"C-0.1 communication consent", at},
        rules:{accepted:true, version:cfg.rulesVersion, age18:true, at},
        tierId:tier.id, prize:tier.value, prizeShort:tier.name,
        claimRef:"ATC-"+code(6), claimBy:addDays(at,Number(cfg.claimDays)||60),
        status:"Awarded", owner:"", reason:"", notes:"", repeats:0,
        mail:{status:"pending", key:null, attempts:[]},
        history:[{at, by:"kiosk", what:`Entered and won ${tier.value} (${tier.weight}% chance). Ref recorded.`}]
      };
      entry.mail.key=entry.claimRef;
      await S.set("entries/"+key, entry);
      return {state:"won", entry, tier, wheel:tiers};
    });
  },
  async patch(key,patch,by,what){const e=await S.get("entries/"+key);if(!e)return;
    const history=[...(e.history||[]),{at:nowIso(),by,what}].slice(-40);
    await S.update("entries/"+key,{...patch,history,updatedAt:nowIso()});}
};

/* ---------------- wheel ---------------- */
const polar=(r,d)=>{const a=d*Math.PI/180;return [r*Math.sin(a),-r*Math.cos(a)];};
/* The wheel draws every prize the same size so each one can be read.
   The draw itself is weighted, and the real chances are one tap away. */
function slices(live){const tot=live.reduce((s,t)=>s+Number(t.weight),0)||1;
  const span=360/(live.length||1);
  return live.map((t,i)=>({t,a0:i*span,a1:(i+1)*span,span,pct:Number(t.weight)/tot*100}));}
const pctText = p => (Math.round(p*10)/10) + "%";
const topTier = tiers => (tiers[0]||{}).id;
/* Scale every non-zero chance so the published table always totals 100%.
   A prize set to 0% stays in the list but leaves the wheel. */
function rebase(cfg){
  const total=cfg.tiers.reduce((s,t)=>s+Number(t.weight||0),0);
  if(!total) return "";
  if(Math.abs(total-100)<0.005) return "";
  cfg.tiers.forEach(t=>{ t.weight = Number(t.weight)>0 ? Math.round(Number(t.weight)*100/total*10)/10 : 0; });
  const drift=Math.round((100-cfg.tiers.reduce((s,t)=>s+t.weight,0))*10)/10;
  if(drift){ const big=cfg.tiers.filter(t=>t.weight>0).sort((a,b)=>b.weight-a.weight)[0]; if(big) big.weight=Math.round((big.weight+drift)*10)/10; }
  return cfg.tiers.filter(t=>t.weight>0).map(t=>`${t.name}: ${t.weight}%`).join("\n");
}

function shownChances(live){const tot=live.reduce((s,t)=>s+Number(t.weight),0)||1;
  return live.map(t=>({t, pct:Number(t.weight)/tot*100}));}
let angle=137;
function wheelSvg(tiers){
  const R=150, sl=slices(tiers);
  const paths=sl.map(({t,a0,a1,span,pct})=>{
    const [x0,y0]=polar(R,a0),[x1,y1]=polar(R,a1),large=span>180?1:0,mid=(a0+a1)/2;
    const d=`M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
    // Labels always read outward along the radius: the wheel turns, so any
    // "upright" rule would only hold at one resting angle.
    const size=span<26?10.5:12, lines=t.lines||[t.short];
    const label=`<g transform="rotate(${mid.toFixed(2)})"><text x="0" y="${-R*0.62}" transform="rotate(-90 0 ${-R*0.62})" text-anchor="middle" fill="${t.ink}" font-family="Saira, Arial, sans-serif" font-weight="600" font-size="${size}" letter-spacing=".4">${
      lines.map((ln,i)=>`<tspan x="0" dy="${i===0?(lines.length>1?-2:4):size+1.5}">${esc(ln)}</tspan>`).join("")}</text></g>`;
    return `<path d="${d}" fill="${t.color}" stroke="#000" stroke-width="1.2"/>${label}`;
  }).join("");
  return `<svg class="wheel" viewBox="-165 -165 330 330" role="img" aria-label="Prize wheel. Every prize is shown the same size; the chances differ.">
    <circle r="161" fill="#0B0B0B" stroke="#FE5D29" stroke-width="2"/>
    <g id="rot" style="transform:rotate(${angle}deg)">${paths}</g>
    <circle r="37" fill="#000" stroke="#FE5D29" stroke-width="2.5"/>
    <text y="2" text-anchor="middle" dominant-baseline="middle" fill="#FE5D29" font-family="Saira, Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="1">ATTICUS</text>
  </svg>
  <svg class="needle" viewBox="0 0 38 54" aria-hidden="true"><path d="M19 54 2 6a17 17 0 0 1 34 0z" fill="#FE5D29" stroke="#000" stroke-width="2"/></svg>`;
}
function spinTo(tiers,tierId){
  const sl=slices(tiers).find(s=>s.t.id===tierId), g=$("#rot");
  if(!g||!sl) return sleep(200);
  const pad=Math.min(sl.span*0.22,4), target=sl.a0+pad+Math.random()*Math.max(sl.span-2*pad,0.4);
  const cur=((angle%360)+360)%360, need=((360-target)-cur+720)%360;
  angle += (reduceMotion()?0:360*6)+need;
  g.style.transform=`rotate(${angle}deg)`;
  return sleep(reduceMotion()?300:5300);
}

function wireForm(){
  const form=$("#entry"), ph=$("#f-phone"), cc=$("#f-cc");
  const reformat=(keepCaret)=>{
    const before=ph.value.slice(0, ph.selectionStart ?? ph.value.length).replace(/\D/g,"").length;
    const out=phoneFormat(cc.value, ph.value);
    if(out!==ph.value){
      ph.value=out;
      if(keepCaret){ let seen=0,pos=out.length;
        for(let i=0;i<out.length;i++){ if(/\d/.test(out[i])){ seen++; if(seen>=before){ pos=i+1; break; } } }
        try{ ph.setSelectionRange(pos,pos); }catch{}
      }
    }
    ph.setAttribute("aria-invalid", ph.value && !phoneValid(cc.value, ph.value) ? "true" : "false");
  };
  ph.addEventListener("input",()=>reformat(true));
  ph.addEventListener("blur",()=>reformat(false));
  cc.addEventListener("change",()=>{ $("#h-phone").textContent=phoneHint(cc.value); reformat(false); ph.focus(); });
  reformat(false);
  form.addEventListener("submit", async ev=>{
    ev.preventDefault(); if(V.busy) return;
    const d={name:$("#f-name").value,email:$("#f-email").value,cc:$("#f-cc").value,phone:$("#f-phone").value,
      book:$("#f-book").value,consent:$("#f-consent").checked,rules:$("#f-rules").checked};
    V.form=d;
    const bad=[]; const mark=(id,isBad)=>{const i=$("#f-"+id);i.setAttribute("aria-invalid",isBad?"true":"false");$("#e-"+id).classList.toggle("show",isBad);if(isBad)bad.push(id);};
    mark("name", d.name.trim().length<2);
    mark("email", !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email.trim()));
    mark("book", d.book.trim().length<1);
    const okPhone=phoneValid(d.cc,d.phone);
    if(!okPhone){ const r=PHONE_RULES[d.cc]||PHONE_RULES.other; $("#e-phone").textContent=`Please check the number: ${r.note}. Example: ${r.ex}`; }
    mark("phone", !okPhone);
    const consentBad=!(d.consent&&d.rules);
    $("#e-consent").classList.toggle("show",consentBad); $("#consentBox").classList.toggle("bad",consentBad);
    if(consentBad) bad.push("consent");
    const box=$("#formErr");
    if(bad.length){ box.hidden=false; box.textContent = bad.includes("consent") && bad.length===1
      ? "Both consent boxes must be ticked to enter the giveaway."
      : `Please check ${bad.length} field${bad.length>1?"s":""} before continuing.`;
      const first=$("#f-"+bad[0]); if(first) first.focus(); return; }
    box.hidden=true;
    V.busy=true; const btn=$("#go"); btn.disabled=true; btn.textContent="Checking…";
    try{

      if(await Engine.noteRepeat(d.email)){ V.screen="already"; await render(); return; }
      V.spinStartedAt=null; V.screen="spin"; await render();
    }catch(err){ box.hidden=false; box.textContent="Couldn't check your details. Try again."; btn.disabled=false; btn.textContent="To the wheel"; }

}

async function doSpin(){
  if(V.busy) return; V.busy=true;
  const btn=$("#spin"), st=$("#status"); btn.disabled=true; st.textContent="Drawing your prize…";
  let res=null;
  if(!V.spinStartedAt) V.spinStartedAt=new Date(Date.now()-2000).toISOString();
  try{ res=await Engine.enterAndSpin(V.form); }
  catch(err){
    if(err.code==="closed"){ V.busy=false; V.screen="closed"; return render(); }
    st.textContent="Connection problem. Tap spin again."; btn.disabled=false; V.busy=false; return;
  }
  if(res.state==="already"){
    // A retry after a dropped connection finds the entry this same spin just saved: show it.
    if(res.entry.createdAt>=V.spinStartedAt){ res={state:"won",entry:res.entry,tier:V.cfg.tiers.find(t=>t.id===res.entry.tierId)}; }
    else { V.busy=false; V.screen="already"; return render(); }
  }
  V.entry=res.entry; V.tier=res.tier;
  // If the prizes on offer changed since the wheel was drawn, redraw it before spinning.
  if(res.wheel && res.wheel.map(t=>t.id).join()!==(V.wheelTiers||[]).map(t=>t.id).join()){
    V.wheelTiers=res.wheel; $(".wheelbox").innerHTML=wheelSvg(res.wheel); await sleep(60);
  }
  if(!V.wheelTiers.some(t=>t.id===res.tier.id)){ V.wheelTiers=[...V.wheelTiers,res.tier]; $(".wheelbox").innerHTML=wheelSvg(V.wheelTiers); await sleep(60); }
  st.textContent="Good luck…";
  await spinTo(V.wheelTiers,res.tier.id);
  announce("You won "+res.entry.prize+". Claim reference "+res.entry.claimRef);
  V.busy=false; V.screen="result"; render();
}

async function sendConfirmation(key){

    const e=await S.get("entries/"+key); if(!e) return {ok:false,why:"missing entry"};

    if(!DELIVERY.connected) return {ok:false, why:"not connected"};
    const msg=renderEmail(e,cfg,false);
    const attempts=[...(e.mail?.attempts||[])];
    try{ await DELIVERY.provider.send({to:e.email, idempotencyKey:e.claimRef, ...msg});
         attempts.push({at:nowIso(),ok:true});

  });

    f("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`),
    f("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`),
    f("xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xesc(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`),
    f("xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`),
    f("xl/styles.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFE5D29"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf xfId="0"/><xf xfId="0" fontId="1" fillId="2" applyFont="1" applyFill="1"><alignment vertical="center"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`),
    f("xl/worksheets/sheet1.xml", sheetXml(rows,widths))
  ]);
}
const EXPORT_COLS=[["Lead ID",12],["Entered (UTC)",22],["Tablet",12],["Name",22],["Email",26],["Phone",18],["Book title",26],["Prize",34],["Claim reference",16],["Claim by",22],["Status",13],["Owner",14],["Reason",20],["Notes",26],["Consent version",15],["Consent at",22],["Rules version",13],["Repeat tries",12]];
const exportRow = e => [e.leadId,e.createdAt,e.tablet,e.name,e.email,e.phoneE164,e.bookTitle,e.prize,e.claimRef,e.claimBy,e.status,e.owner,e.reason,e.notes,e.consent?.version,e.consent?.at,e.rules?.version,Number(e.repeats)||0];
async function offerFile(filename, data){
  if(DL){ try{ await DL.save({filename,data}); return true; }catch(err){ if(err.code==="declined") return false;
      toast("That didn't save: "+(err.message||err.code),"bad"); return false; } }
  const blob = data instanceof Blob ? data : new Blob([data],{type:"text/csv"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); return true;
}
async function exportXlsx(){
  const rows=[EXPORT_COLS.map(c=>c[0]), ...ST.entries.map(exportRow)];
  const blob=workbook(rows, EXPORT_COLS.map(c=>c[1]), "Frankfurt entries");
  await offerFile(`atticus-frankfurt-entries-${new Date().toISOString().slice(0,10)}.xlsx`, blob);
}
function csv(rows){
  const cols=["Lead ID","Entered (UTC)","Tablet","Name","Email","Phone","Book title","Prize","Claim reference","Claim by","Status","Owner","Reason","Notes","Consent version","Consent at","Rules version","Repeat tries"];
  const cell=v=>{let s=String(v??"");if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};
  return [cols.map(cell).join(","), ...rows.map(e=>[e.leadId,e.createdAt,e.tablet,e.name,e.email,e.phoneE164,e.bookTitle,e.prize,e.claimRef,e.claimBy,e.status,e.owner,e.reason,e.notes,e.consent?.version,e.consent?.at,e.rules?.version,e.repeats].map(cell).join(","))].join("\r\n");
}
async function exportCsv(){
  await offerFile(`atticus-frankfurt-entries-${new Date().toISOString().slice(0,10)}.csv`, "\uFEFF"+csv(ST.entries));
}

/* ---------------- events ---------------- */
document.addEventListener("click", async ev=>{
  resetIdle();
  if(ev.target.closest("a[href]")) return;        // let links do their own thing
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(act==="start"){ const cfg=await Engine.config(); V.screen=Engine.available(cfg, await Engine.counts()).length?"form":"closed"; render(); }
  else if(act==="cancel"||act==="done"){ startOver(); }
  else if(act==="spin"){ doSpin(); }
  else if(act==="chances"){ showChances(); }
  else if(act==="close-chances"){ $("#chancedlg")?.close(); }
  else if(act==="staff"){ staffGate(); }
  else if(act==="exit-staff"){ ST.open=false; startOver(); }
  else if(act==="lock"){ ST.open=false; staffGate(); }
  else if(act==="tab"){ ST.tab=el.dataset.tab; $$(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===ST.tab))); paintTab(); }
  else if(act==="toggle"){
    const cfg=clone(V.cfg), t=cfg.tiers.find(x=>x.id===el.dataset.id); t.active=!t.active;
    await Engine.saveConfig(cfg, ST.by, `${t.name} ${t.active?"put back on":"removed from"} the wheel`); renderStaff();
    toast(`${t.name} ${t.active?"is back on the wheel":"is off the wheel"}.`);
  }
  else if(act==="limit"){ ST.editLimit=el.dataset.id; await paintTab();
    const inp=$(`[data-limit-input="${ST.editLimit}"]`); if(inp){ inp.focus(); inp.select(); } }
  else if(act==="limit-cancel"){ ST.editLimit=null; paintTab(); }
  else if(act==="limit-save"){
    const id=el.dataset.id, inp=$(`[data-limit-input="${id}"]`), raw=inp?inp.value.trim():"";
    const n=Math.floor(Number(raw));
    if(raw==="" || !Number.isFinite(n) || n<0){ toast("Enter a whole number of winners, for example 5.","bad"); inp?.focus(); return; }
    const cfg=clone(V.cfg), t=cfg.tiers.find(x=>x.id===id), was=t.limit;
    if(n===was){ ST.editLimit=null; return paintTab(); }
    t.limit=n; ST.editLimit=null;
    await Engine.saveConfig(cfg, ST.by, `${t.name} limit ${was} to ${n}`);
    toast(`${t.name}: limit changed from ${was} to ${n}.`);
    renderStaff();
  }
  else if(act==="email-tier"){ ST.emailTier=el.dataset.id; paintTab(); }
  else if(act==="email-view"){ ST.emailView=el.dataset.v; paintTab(); }
  else if(act==="email-save"){
    const cfg=clone(V.cfg); cfg.email=deepMerge(EMAIL_DEFAULTS,cfg.email||{});
    const td=cfg.email.tiers[ST.emailTier]=cfg.email.tiers[ST.emailTier]||{};
    $$("[data-ef]").forEach(x=>td[x.dataset.ef]=x.value.trim());
    $$("[data-eg]").forEach(x=>cfg.email[x.dataset.eg]=x.value.trim());
    await Engine.saveConfig(cfg,ST.by,`email details updated (${ST.emailTier})`); V.cfg=cfg; paintTab();
    const m=emailMissing(ST.emailTier,cfg); toast(m.length?`Saved. ${m.length} required detail${m.length>1?"s":""} still missing for this prize.`:"Saved. This prize's email is complete.");
  }
  else if(act==="email-dl-html"||act==="email-dl-text"){
    const msg=renderEmail(SAMPLE_ENTRY(V.cfg,ST.emailTier),V.cfg,true), html=act==="email-dl-html";
    await offerFile(`test-email-${ST.emailTier}.${html?"html":"txt"}`, new Blob([html?msg.html:msg.text],{type:html?"text/html":"text/plain"}));
  }
  else if(act==="lead-email"){
    const e=ST.entries.find(x=>x.key===el.dataset.key); if(!e) return;
    const msg=renderEmail(e,V.cfg,true); $("#dlg")?.close();
    $("#emaildlg")?.remove(); const d=document.createElement("dialog"); d.id="emaildlg"; d.style.width="min(700px,96vw)";
    d.innerHTML=`<div class="dlg"><h2 style="font-size:1.1rem">Email for ${esc(e.name)}</h2><p class="small muted">Subject: ${esc(msg.subject)}</p>
      <p><span class="badge ${emailStatus(e,V.cfg).kind}">${esc(emailStatus(e,V.cfg).label)}</span></p>
      <iframe style="width:100%;height:520px;border:1px solid var(--line);border-radius:12px;background:#F2F2F2" title="Email preview"></iframe>
      <button class="btn sm" data-act="close-email" style="margin-top:.6rem">Close</button></div>`;
    document.body.appendChild(d); $("iframe",d).srcdoc=msg.html; d.showModal();
  }
  else if(act==="close-email"){ $("#emaildlg")?.close(); }
  else if(act==="install-app"){ const e=APP.promptEvt; if(!e) return; e.prompt(); const r=await e.userChoice.catch(()=>({})); APP.promptEvt=null; refreshAppPanel(); if(r.outcome!=="accepted") toast("Install cancelled. You can try again from Settings."); }
  else if(act==="apply-update"){ location.reload(); }
  else if(act==="open"){ openLead(el.dataset.key); }
  else if(act==="close-dlg"){ $("#dlg")?.close(); }
  else if(act==="save-lead"){
    const key=el.dataset.key, e=ST.entries.find(x=>x.key===key), err=$("#d-err");
    const status=$("#d-status").value, owner=$("#d-owner").value.trim(), reason=$("#d-reason").value.trim(), notes=$("#d-notes").value;
    if(["Expired","Cancelled"].includes(status)&&!reason){ err.hidden=false; err.textContent="Add a reason first."; return; }
    const changes=[]; if(status!==e.status)changes.push(`status ${e.status} → ${status}`); if(owner!==(e.owner||""))changes.push("owner "+(owner||"cleared"));
    if(notes!==(e.notes||""))changes.push("notes edited");
    await Engine.patch(key,{status,owner,reason,notes},ST.by,changes.join("; ")||"reviewed");
    $("#dlg")?.close(); ST.entries=await S.list("entries"); paintTab();
  }
  else if(act==="csv"){ exportCsv(); }
  else if(act==="xlsx"){ exportXlsx(); }
  else if(act==="save-settings"){
    const cfg=clone(V.cfg);
    cfg.standTablet=$("#s-tablet").value.trim()||"Tablet 1";
    cfg.idleSeconds=Math.min(180,Math.max(10,Number($("#s-idle").value)||45));
    cfg.claimDays=Math.max(1,Number($("#s-claim").value)||60);
    const pin=$("#s-pin").value.trim(); if(/^\d{4,8}$/.test(pin)) cfg.pin=pin; else { toast("The PIN should be 4 to 8 digits.","bad"); return; }
    await Engine.saveConfig(cfg,ST.by,"kiosk settings updated"); renderStaff(); toast("Settings saved.");
  }
  else if(act==="save-weights"){
    const cfg=clone(V.cfg); const changes=[];
    cfg.tiers.forEach((t,i)=>{const w=Math.max(0,Number($(`[data-w="${i}"]`).value||0)); if(w!==Number(t.weight)){changes.push(`${t.name} ${t.weight}% to ${w}%`); t.weight=w;}});
    if(!changes.length){ toast("Nothing changed."); return; }
    const note=rebase(cfg);
    await Engine.saveConfig(cfg,ST.by,"chances: "+changes.join(", ")+(note?"; re-based to 100%":"")); renderStaff();
    toast(note ? "Saved. The other prizes took up the difference so the total is 100%:\n"+note : "Chances saved.");
  }
  else if(act==="wipe"){
    if(!(await confirmDlg("Delete every entry?","This clears all entries stored on this tablet. Export them first if you need them.","Delete them"))) return;
    for(const e of await S.list("entries")) await S.del("entries/"+e.key);
    ST.entries=[]; renderStaff(); toast("All entries deleted.");
  }
});
document.addEventListener("keydown",ev=>{ resetIdle();
  if(ev.key==="Enter"&&document.activeElement?.dataset?.act==="start"){ V.screen="form"; render(); }});
["pointerdown","touchstart"].forEach(t=>document.addEventListener(t,resetIdle,{passive:true}));

/* ---------------- boot ---------------- */
(async function(){
  $("#app").innerHTML=`<section class="screen attract">${logo()}<p class="muted">Starting…</p></section>`;
  let settled=false;
  const ready=(async()=>{
    if(!window.claude||typeof window.claude.use!=="function") return;
    try{ DL=await window.claude.use("downloads"); }catch{}
    try{ const db=await window.claude.use("db"); if(db&&!settled){ const st=dbStore(db); await st.list("entries"); if(!settled) S=st; } }
    catch(e){ console.warn("Shared store unavailable; using this tablet.",e); }
  })();
  await Promise.race([ready, sleep(6000)]); settled=true;
  await render();
})();
</script>
